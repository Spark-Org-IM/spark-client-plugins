name: dependencies

# Dependency check. Runs every day and on demand. It upgrades the runner's
# packages (compiler, CMake, ...), resolves the upstream spark-client plugin
# SDK, refreshes the SDK cache used by every build, and rebuilds the plugins
# against the newest toolchain and SDK. It never publishes anything.
on:
  schedule:
    # Every day at 00:00 UTC.
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

# ccache is content-keyed; hashing the compiler binary keeps the cache usable
# after package upgrades that only touch file timestamps.
env:
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 200M

concurrency:
  group: dependencies
  cancel-in-progress: true

jobs:
  sdk:
    name: plugin-sdk
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Keep the whole environment current, not just the packages listed in
      # the install line below. The user asked for compilers too, so this is
      # an upgrade of every installed package before the build.
      - name: Update system packages
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get -y \
            -o Dpkg::Options::=--force-confdef \
            -o Dpkg::Options::=--force-confold \
            upgrade
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache

      - name: Resolve plugin SDK revision
        id: sdk
        run: |
          sha=$(git ls-remote https://github.com/Spark-Org-IM/spark-client.git \
                  refs/heads/main | cut -f1)
          if [ -z "$sha" ]; then
            echo "cannot resolve the spark-client main branch" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Saving under the upstream revision makes ordinary CI restore exactly
      # the SDK it expects. A new upstream commit therefore lands in the cache
      # the first time this workflow runs after it.
      - name: Refresh cached plugin SDK
        uses: actions/cache@v6
        with:
          path: .sdk/spark-client
          key: spark-client-sdk-${{ steps.sdk.outputs.sha }}

      - name: Fetch plugin SDK
        run: |
          if [ ! -f .sdk/spark-client/src/plugin/api.h ]; then
            mkdir -p .sdk
            rm -rf .sdk/spark-client
            git clone --depth 1 \
              https://github.com/Spark-Org-IM/spark-client.git \
              .sdk/spark-client
          fi
          git -C .sdk/spark-client rev-parse HEAD

      - name: Check plugin SDK
        run: |
          test -f .sdk/spark-client/src/plugin/api.h
          test -f .sdk/spark-client/src/plugin/sdk.h
          abi=$(sed -n \
            's/^#define SPARK_PLUGIN_ABI_VERSION \([0-9][0-9]*\)u*$/\1/p' \
            .sdk/spark-client/src/plugin/api.h)
          echo "spark-client SDK ABI: ${abi:-unknown}"
          test -n "$abi"
          json_version=$(grep -m1 -o 'version [0-9][0-9.]*' \
            third_party/nlohmann/json.hpp | cut -d' ' -f2)
          cc_version=$(cc --version | head -n 1)
          cmake_version=$(cmake --version | head -n 1)
          {
            echo "### Dependencies"
            echo ""
            echo "- Upstream \`Spark-Org-IM/spark-client@${{ steps.sdk.outputs.sha }}\`"
            echo "- ABI version: \`$abi\`"
            echo "- Vendored nlohmann/json: \`${json_version:-unknown}\`"
            echo "- Compiler: \`$cc_version\`"
            echo "- \`$cmake_version\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DSPARK_PLUGIN_SDK_INCLUDE_DIR="$PWD/.sdk/spark-client/src" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel 4

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: ccache statistics
        run: ccache --show-stats
