name: release

# Plugins do not wait for a tag. Merging to main builds both architectures,
# the Debian source package, and publishes three tars:
#   - linux-amd64 shared objects
#   - linux-arm64 shared objects
#   - all release files (debs, source package, modules and docs)
# Other branches only run the ci workflow and never publish.
on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CCACHE_COMPILERCHECK: content
  CCACHE_MAXSIZE: 200M

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache debhelper dpkg-dev

      - name: Check version metadata
        run: packaging/sync-version.sh --check

      - name: Resolve plugin SDK revision
        id: sdk
        run: |
          sha=$(git ls-remote https://github.com/Spark-Org-IM/spark-client.git \
                  refs/heads/main | cut -f1)
          if [ -z "$sha" ]; then
            echo "cannot resolve the spark-client main branch" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore cached plugin SDK
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: .sdk/spark-client
          key: spark-client-sdk-${{ steps.sdk.outputs.sha }}

      - name: Fetch plugin SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .sdk
          git clone --depth 1 \
            https://github.com/Spark-Org-IM/spark-client.git \
            .sdk/spark-client

      - name: Check plugin SDK
        run: |
          test -f .sdk/spark-client/src/plugin/api.h
          test -f .sdk/spark-client/src/plugin/sdk.h
          abi=$(sed -n \
            's/^#define SPARK_PLUGIN_ABI_VERSION \([0-9][0-9]*\)u*$/\1/p' \
            .sdk/spark-client/src/plugin/api.h)
          echo "spark-client SDK ABI: ${abi:-unknown}"
          test -n "$abi"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Debian packages
        env:
          SPARK_PLUGIN_SDK_INCLUDE_DIR: ${{ github.workspace }}/.sdk/spark-client/src
        run: dpkg-buildpackage -us -uc -b -d

      - name: ccache statistics
        run: ccache --show-stats

      - name: Stage packages and plugin modules
        run: |
          mkdir -p "stage/linux-${{ matrix.arch }}"
          cp ../sparkapp-plugin-*.deb "stage/linux-${{ matrix.arch }}/"
          cp ../spark-client-plugins_*.changes \
             ../spark-client-plugins_*.buildinfo \
             "stage/linux-${{ matrix.arch }}/"
          find obj-* -maxdepth 1 -name 'spark-manage-*.so' \
            -exec cp {} "stage/linux-${{ matrix.arch }}/" \;
          ls -l "stage/linux-${{ matrix.arch }}"

      - name: Upload packages and modules
        uses: actions/upload-artifact@v7
        with:
          name: plugins-${{ matrix.arch }}
          # Keep linux-<arch>/ so both architectures can be merged later.
          path: stage
          if-no-files-found: error

  source:
    name: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install source packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev

      - name: Build Debian source package
        run: |
          packaging/sync-version.sh --check
          packaging/build-source.sh

      - name: Upload source package
        uses: actions/upload-artifact@v7
        with:
          name: source
          path: build/source/*
          if-no-files-found: error

  publish:
    name: publish
    needs:
      - build
      - source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Download packages and modules
        uses: actions/download-artifact@v8
        with:
          pattern: plugins-*
          merge-multiple: true
          path: bundle

      - name: Download source package
        uses: actions/download-artifact@v8
        with:
          name: source
          path: source

      - name: Build the release tars
        run: |
          set -eu
          version=$(head -n 1 VERSION | tr -d '[:space:]')
          test -n "$version"
          folder="spark-client-plugins-${version}"

          # 1. Everything that belongs to the release.
          mkdir -p "dist/${folder}/linux-amd64" \
                   "dist/${folder}/linux-arm64" \
                   "dist/${folder}/source"
          cp bundle/linux-amd64/* "dist/${folder}/linux-amd64/"
          cp bundle/linux-arm64/* "dist/${folder}/linux-arm64/"
          cp source/* "dist/${folder}/source/"
          cp README.md LICENSE VERSION "dist/${folder}/"
          (
            cd "dist/${folder}"
            find . -type f ! -name SHA256SUMS -printf '%P\n' | sort \
              | xargs -r sha256sum > SHA256SUMS
          )
          tar -C dist -czf \
            "dist/spark-client-plugins_${version}_all.tar.gz" "${folder}"

          # 2./3. Per-architecture shared objects.
          for arch in amd64 arm64; do
            name="spark-client-plugins-${version}-linux-${arch}"
            mkdir -p "dist/${name}"
            cp "bundle/linux-${arch}"/*.so "dist/${name}/"
            tar -C dist -czf \
              "dist/spark-client-plugins_${version}_linux-${arch}.tar.gz" \
              "${name}"
          done

          ls -l dist/*.tar.gz
          tar -tzf "dist/spark-client-plugins_${version}_all.tar.gz"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(head -n 1 VERSION | tr -d '[:space:]')
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz --clobber
          else
            # The tag normally does not exist yet, so the release creates it.
            gh release create "$tag" dist/*.tar.gz \
              --target "$GITHUB_SHA" \
              --title "Plugins v${version}" \
              --generate-notes \
              || gh release upload "$tag" dist/*.tar.gz --clobber
          fi
